authenticator:
  admin:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    key: "${jwt_signing_key:dev_only_change_me_in_prod}" # JWT 签名密钥，生产环境必须通过环境变量 jwt_signing_key 覆盖
    access_token_expires: 5400s      # 1.5 小时
    refresh_token_expires: 43200s       # 12 小时
    aes_key: "${aes_key:dev_only_change_me}" # AES 加密密钥，必须是 16、24 或 32 字节长，生产环境必须通过环境变量 aes_key 覆盖

  app:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    key: "${jwt_signing_key:dev_only_change_me_in_prod}" # JWT 签名密钥，生产环境必须通过环境变量 jwt_signing_key 覆盖
    access_token_expires: 900s        # 移动/客户端短期 token 15分钟
    refresh_token_expires: 0s        # 0s 表示不颁发/禁用 refresh token
    aes_key: "${aes_key:dev_only_change_me}"
