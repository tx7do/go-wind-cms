server:
  rest:
    addr: "0.0.0.0:6600"
    timeout: 10s
    enable_swagger: false
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
        - "X-Captcha-Id"
        - "X-Captcha-Value"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "http://localhost:15999"
        - "http://127.0.0.1:15999"
    middleware:
      auth:
        method: "HS256"
        key: "${jwt_signing_key:dev_only_change_me_in_prod}"

  sse:
    addr: ":6601"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false

  # MCP 服务器（可选，把 CMS 查询/发布能力暴露给 AI 代理）。未配置时回退
  # 环境变量 MCP_ADDR；off/disabled 显式停用。鉴权 Token 只走环境变量
  # MCP_TOKEN（必填，缺失拒绝启动——凭据不入配置文件）。
  # mcp:
  #   address: ":6603"
  #   server_name: "GoWind CMS"
  #   server_version: "1.1.0"
  #   server_type: "HTTP"       # SSE/HTTP/STDIO/IN_PROCESS
  #   instructions: "GoWind CMS content queries and publishing"
  #   recovery: true
  #   tool_capabilities: true

  # 协同编辑 ws 服务器（默认 :6602）。未配置时回退环境变量 COLLAB_ADDR /
  # COLLAB_ALLOWED_ORIGINS；addr 写 off/disabled 显式停用。
  # collab:
  #   addr: ":6602"
  #   allowed_origins:
  #     - "http://localhost:15999"

  grpc:
    addr: "0.0.0.0:0"
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true
