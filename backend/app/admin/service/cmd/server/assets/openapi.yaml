        notify.service.v1.TestDispatchNotificationRequest:
            type: object
            properties:
                id:
                    type: integer
                    description: 规则ID
                    format: uint32
                target:
                    type: string
                    description: 投递目标（收件邮箱/回调地址）
                title:
                    type: string
                    description: 通知标题，留空用测试文案
                content:
                    type: string
                    description: 通知正文，留空用测试文案
            description: |-
                测试投递 - 请求。

                 target/title/content 全可空，缺省即"这条规则本来会发什么"：
                 target 对 EMAIL 是必填的投递目标，对 WEBHOOK 留空则取第一个启用的 WEBHOOK 渠道配置的 webhook_url；
                 title/content 留空由服务端渲染一封测试文案。
                 INTERNAL 规则拒绝测试（站内信投递由业务动作驱动，无"测试文案"语义）。
