                    format: uint32
                timeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务超时时间
                deadline:
                    type: string
                    description: 任务截止时间
                    format: date-time
                processIn:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务延迟处理时间
                processAt:
                    type: string
                    description: 任务执行时间点
                    format: date-time
                uniqueTTL:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务唯一锁定时间
                retention:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务结果保留时间
                group:
                    type: string
                    description: 任务分组
                taskID:
                    type: string
                    description: 任务唯一标识ID
            description: 任务选项
        task.service.v1.UpdateTaskRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/task.service.v1.Task'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新调度任务 - 请求
        translator.service.v1.TranslateRequest:
            type: object
            properties:
                sourceLanguage:
                    type: string
                    description: 源语言（如 'en'）
                targetLanguage:
                    type: string
                    description: 目标语言（如 'zh'）
                content:
                    type: string
                    description: 待翻译内容
        translator.service.v1.TranslateResponse:
            type: object
            properties:
                translatedContent:
                    type: string
                    description: 翻译后的内容
                rawContent:
                    type: string
                    description: 原始内容（供调试使用）
        webhook.service.v1.CreateWebhookRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/webhook.service.v1.Webhook'
            description: 请求 - 创建 Webhook
        webhook.service.v1.ListWebhookDeliveriesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/webhook.service.v1.WebhookDelivery'
                total:
                    type: string
            description: 回应 - 投递记录列表
        webhook.service.v1.ListWebhookResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/webhook.service.v1.Webhook'
                total:
                    type: string
            description: 回应 - Webhook 列表
        webhook.service.v1.TestWebhookPingRequest:
            type: object
            properties:
                id:
                    type: integer
                    description: Webhook ID
                    format: uint32
            description: 请求 - 发送测试事件
        webhook.service.v1.UpdateWebhookRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/webhook.service.v1.Webhook'
                updateMask:
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 不存在则新增
            description: 请求 - 更新 Webhook
        webhook.service.v1.Webhook:
            type: object
            properties:
                id:
                    type: integer
                    description: Webhook ID
                    format: uint32
                url:
                    type: string
                    description: 回调 URL
                secret:
                    type: string
                    description: '签名密钥（X-Webhook-Signature: sha256=HMAC(body)）'
                events:
                    type: array
                    items:
                        type: string
                    description: 订阅的事件类型；空=全部
                enabled:
                    type: boolean
                    description: 是否启用
                description:
                    type: string
                    description: 用途说明
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
            description: Webhook 订阅
        webhook.service.v1.WebhookDelivery:
            type: object
            properties:
                id:
                    type: integer
                    description: 投递记录ID
                    format: uint32
                webhookId:
                    type: integer
                    description: 关联的 Webhook ID
                    format: uint32
                event:
                    type: string
                    description: 事件类型
                entityId:
                    type: integer
                    description: 事件主体 ID
                    format: uint32
                status:
                    type: string
                    description: 投递状态（DELIVERY_STATUS_SUCCESS/FAILED）
                httpStatus:
                    type: integer
                    description: 响应 HTTP 状态码（0=未达 HTTP 层）
                    format: int32
                error:
                    type: string
                    description: 失败原因
                durationMs:
                    type: integer
                    description: 耗时（毫秒）
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
            description: 投递记录（每次尝试一行）
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AccessKeyService
      description: OpenAPI 访问凭证（AK/SK）管理 — BFF
    - name: AdminPortalService
      description: 后台前端初始化数据与配置服务
    - name: AiAgentService
      description: AI Agent 编排管理服务（可视化画布）
    - name: AiChatService
      description: |-
        AI 对话服务（表单助手）

         流式语义：本 RPC 是普通 POST（body 为扁平请求体，不包 data）。
         BFF 消费 core 的 ChatStreamFrame 流：chunk/tool 帧经 SSE 网关
         （`ai_chat_chunk` / `ai_chat_tool` 事件）推给发起用户，done 帧作为
         同步响应返回。前端先累积 chunk 做流式渲染，POST 响应到达后以响应
         中的完整消息为准。
    - name: AiContentService
      description: AI 内容生成服务（表单助手）
    - name: AiConversationService
      description: AI 对话会话管理服务
    - name: AiKnowledgeBaseService
      description: AI 知识库管理服务（RAG）
    - name: AiMessageService
      description: AI 对话消息服务
    - name: AiProviderService
      description: AI 模型提供商管理服务
    - name: AiQueryService
      description: |-
        智能问数服务（NL → 只读 SQL → 结构化结果）
         平台管理员专属：第一版查的是全平台数据，且 SQL 会触达原生库表。
    - name: AiUsageLogService
      description: AI 用量流水服务（配额记账事实源）
    - name: ApiAuditLogService
      description: API审计日志管理服务
    - name: ApiService
      description: API资源管理服务
    - name: AuthenticationService
      description: 用户后台登录认证服务
    - name: CategoryService
      description: 类别服务
    - name: CommentService
      description: 评论服务
    - name: ComponentDefinitionService
      description: 组件定义服务（内容建模 Components 的管理面）
    - name: ConfigService
      description: 系统参数管理服务
    - name: ContentModelService
      description: 内容模型管理服务
    - name: DataAccessAuditLogService
      description: 数据访问审计日志管理服务
    - name: DictEntryService
      description: 数据字典条目管理服务
    - name: DictTypeService
      description: 数据字典分类管理服务
    - name: EditLockService
      description: 编辑锁管理服务（协同编辑 v1）
    - name: ExperimentService
      description: 内容实验管理服务（A/B 分流 + 受众定向）
    - name: FileService
      description: 文件管理服务
    - name: FileTransferService
      description: 文件传输服务
    - name: FlowRuleService
      description: 自动化 Flow 规则服务（admin 门面）
    - name: FormSubmissionService
      description: 表单提交管理服务（页面 FORM 区块的访客提交）
    - name: InteractionAdminService
      description: |-
        交互管理服务（运营清数据面）。仅转发至 core InteractionAdminService，
         调用方须为平台管理员（由 core 侧运营上下文 guard 校验）。
    - name: InternalMessageCategoryService
      description: 站内信消息分类管理服务
    - name: InternalMessageRecipientService
      description: 站内信消息管理服务
    - name: InternalMessageService
      description: 站内信消息管理服务
    - name: LanguageService
      description: 语言管理服务
    - name: LoginAuditLogService
      description: 登录审计日志管理服务
    - name: LoginPolicyService
      description: 登录策略管理服务
    - name: MFAService
