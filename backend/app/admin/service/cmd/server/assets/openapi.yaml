components:
    schemas:
        KratosStatus:
            type: object
            properties:
                code:
                    type: number
                    description: 错误码
                    format: int32
                message:
                    type: string
                    description: 错误消息
                reason:
                    type: string
                    description: 错误原因
                metadata:
                    type: object
                    description: 元数据
            description: Kratos错误返回
        access_key.service.v1.AccessKey:
            type: object
            properties:
                id:
                    type: integer
                    description: 凭证ID
                    format: uint32
                name:
                    type: string
                    description: 凭证名称（用途说明）
                accessKey:
                    type: string
                    description: 访问键（AK，公开标识，调用时随令牌交换请求上送）
                status:
                    enum:
                        - OFF
                        - ON
                    type: string
                    description: 凭证状态（停用后令牌交换被拒绝）
                    format: enum
                expiresAt:
                    type: string
                    description: 过期时间（留空表示长期有效）
                    format: date-time
                lastUsedAt:
                    type: string
                    description: 最近一次令牌交换时间
                    format: date-time
                tenantId:
                    type: integer
                    description: 归属租户ID（机器令牌继承该租户的隔离）
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: OpenAPI 访问凭证（AK/SK）
        access_key.service.v1.CreateAccessKeyRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/access_key.service.v1.AccessKey'
            description: 创建访问凭证 - 请求
        access_key.service.v1.CreateAccessKeyResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/access_key.service.v1.AccessKey'
                secret:
                    type: string
            description: 创建访问凭证 - 回应（secret 仅本次明文返回，服务端只存 SHA-256 摘要）
        access_key.service.v1.IssueTokenRequest:
            type: object
            properties:
                accessKey:
                    type: string
                    description: 访问键
                secret:
                    type: string
                    description: 密钥（创建凭证时一次性下发）
                clientIp:
                    type: string
                    description: 调用方IP（BFF 注入，仅用于限流计数）
            description: 令牌交换 - 请求（机器对机器：AK/SK 换取短期 JWT）
        access_key.service.v1.IssueTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 访问令牌（Bearer）
                expiresIn:
                    type: integer
                    description: 有效期（秒）
                    format: uint32
                tokenType:
                    type: string
                    description: 令牌类型（bearer）
            description: 令牌交换 - 回应
        access_key.service.v1.ListAccessKeyResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/access_key.service.v1.AccessKey'
                total:
                    type: string
            description: 查询访问凭证列表 - 回应
        access_key.service.v1.ResetAccessKeySecretRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
            description: 重置密钥 - 请求
        access_key.service.v1.UpdateAccessKeyRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/access_key.service.v1.AccessKey'
                updateMask:
                    example: id,name,status
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新访问凭证 - 请求
        admin.service.v1.CreatePagePreviewTokenRequest:
            type: object
            properties:
                id:
                    type: integer
                    description: 页面ID
                    format: uint32
            description: 请求 - 签发页面预览令牌
        admin.service.v1.CreatePostPreviewTokenRequest:
            type: object
            properties:
                id:
                    type: integer
                    description: 帖子ID
                    format: uint32
            description: 请求 - 签发帖子预览令牌
        admin.service.v1.InitialContextResponse:
            type: object
            properties:
                menus:
                    type: array
                    items:
                        $ref: '#/components/schemas/permission.service.v1.MenuRouteItem'
                permissions:
                    type: array
                    items:
                        type: string
        admin.service.v1.ListPermissionCodeResponse:
            type: object
            properties:
                codes:
                    type: array
                    items:
                        type: string
                hiddenFields:
                    type: array
                    items:
                        type: string
                    description: 字段权限隐藏字段集（"资源.字段" 串数组；平台用户为空）
            description: 查询权限码列表 - 回应
        admin.service.v1.ListRouteResponse:
