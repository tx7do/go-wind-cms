                        $ref: '#/components/schemas/monitor_alert.service.v1.MonitorAlertRule'
        monitor_alert.service.v1.MonitorAlertRule:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                name:
                    type: string
                metric:
                    enum:
                        - MONITOR_METRIC_UNSPECIFIED
                        - GO_GOROUTINES
                        - GO_MEM_ALLOC_MB
                        - DB_OPEN_CONNECTIONS
                        - DB_PING_FAIL
                        - REDIS_DB_SIZE
                    type: string
                    format: enum
                op:
                    enum:
                        - ALERT_OP_UNSPECIFIED
                        - GE
                        - LE
                    type: string
                    description: DB_PING_FAIL 时忽略 op/threshold
                    format: enum
                threshold:
                    type: number
                    format: double
                cooldownMinutes:
                    type: integer
                    description: 重复告警冷却（分钟）：持续越限时按此间隔重发，默认 30
                    format: uint32
                channel:
                    enum:
                        - CHANNEL_UNSPECIFIED
                        - EMAIL
                        - WEBHOOK
                        - INTERNAL
                        - SMS
                        - EXT
                    type: string
                    description: 告警渠道（显式指定）
                    format: enum
                target:
                    type: string
                    description: 投递目标：EMAIL 为收件地址，WEBHOOK 为回调 URL
                isEnabled:
                    type: boolean
                remark:
                    type: string
                lastFiring:
                    type: boolean
                    description: —— 以下为评估器回写状态（只读） ——
                lastValue:
                    type: number
                    format: double
                lastAlertedAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
            description: |-
                监控告警规则：指标阈值 → 触发通知。
                 渠道与目标显式写在规则上（不经路由表）：告警是"点对点"的运营配置，
                 路由表解决的是"事件该发去哪类渠道"，而这里要的是"这条告警发到这个邮箱"。
        monitor_alert.service.v1.UpdateMonitorAlertRuleRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
