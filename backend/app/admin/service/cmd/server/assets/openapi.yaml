                    format: uint32
                eventType:
                    enum:
                        - EVENT_TYPE_UNSPECIFIED
                        - INTERNAL_MESSAGE
                        - CHANNEL_TEST_EMAIL
                        - CHANNEL_TEST_EXT
                        - CHANNEL_TEST_SMS
                        - MONITOR_ALERT
                        - PASSWORD_RESET_CODE
                        - SYSTEM_NOTIFY
                    type: string
                    description: 业务事件类型
                    format: enum
                channel:
                    enum:
                        - CHANNEL_UNSPECIFIED
                        - EMAIL
                        - WEBHOOK
                        - INTERNAL
                        - SMS
                        - EXT
