                    description: 投递渠道
                    format: enum
                channelId:
                    type: integer
                    description: 实际选中的渠道配置ID
                    format: uint32
                recipientUserId:
                    type: integer
                    description: 收件用户ID（直发模式可为空）
                    format: uint32
                target:
                    type: string
                    description: 投递目标（脱敏）
                status:
                    enum:
                        - DELIVERY_STATUS_UNSPECIFIED
                        - SENDING
                        - SENT
                        - FAILED
                        - SKIPPED
                    type: string
                    description: 投递状态
                    format: enum
