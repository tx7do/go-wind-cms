                    type: string
                    description: 最近一次失败原因
                sentAt:
                    type: string
                    description: 投递完成时间
                    format: date-time
                relatedId:
                    type: integer
                    description: 关联业务对象ID（按 event_type 解释）
                    format: uint32
                requestId:
                    type: string
                    description: 派发请求ID（幂等锚）
                attempts:
                    type: integer
                    description: 实际尝试投递次数（含首次）
                    format: uint32
                receiptProviderId:
                    type: string
                    description: 服务商侧消息ID
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                一条通知 × 一个渠道 × 一个收件人 = 一行投递台账。
                 不存正文快照（防敏感正文明文集邮），target 落脱敏串；排障经 related_id 跳回业务对象。
        notify.service.v1.NotificationPreference:
            type: object
            properties:
                userId:
                    type: integer
                    format: uint32
                quietEnabled:
                    type: boolean
                    description: |-
                        是否启用实时推送静音时段：只抑制 SSE 实时推送（角标即时性），
                         收件行照常落库，用户打开收件箱仍能看到全部消息。
                quietStartMinute:
                    type: integer
                    description: 静音开始：自当日 00:00 起的分钟数（0-1439），默认 1320（22:00）。
                    format: int32
                quietEndMinute:
                    type: integer
                    description: |-
                        静音结束：自当日 00:00 起的分钟数（0-1439），默认 480（08:00）。
                         跨零点窗口（start > end，如 22:00→08:00）合法；start == end 且启用视为无效配置。
                    format: int32
                mutedCategoryIds:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: 退订的站内信分类 ID 列表（预留：CMS v1 无全员广播，无执行点，仅落库）
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                用户通知偏好（每用户一行）。
                 服务端从操作人钉定 user_id，客户端传入的 user_id 一律忽略。
                 刻意无租户维度：偏好跟人走，全链 fail-open（读不到偏好 = 不静音不退订）。
