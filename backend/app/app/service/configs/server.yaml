server:
  rest:
    addr: "0.0.0.0:6700"
    timeout: 10s
    enable_swagger: false
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "http://localhost:15001"
        - "http://localhost:15011"
        - "http://localhost:15021"
        - "http://localhost:10086"
        # 127.0.0.1 形态的 dev 端口（浏览器按 IP 访问 dev server 时 Origin 是 127.0.0.1，
        # 与 localhost 不同源；缺失时预检无 ACAO 头、C 端登录等请求被浏览器拦截成"网络异常"）
        - "http://127.0.0.1:15001"
        - "http://127.0.0.1:15011"
        - "http://127.0.0.1:15021"
        - "https://api.cms.gowind.cloud"
        - "https://vue.cms.gowind.cloud"
        - "https://react.cms.gowind.cloud"
        - "https://taro.cms.gowind.cloud"
        - "https://flutter.cms.gowind.cloud"
    middleware:
      auth:
        method: "HS256"
        key: "${jwt_signing_key:dev_only_change_me_in_prod}"

  sse:
    addr: ":6701"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false

  grpc:
    addr: "0.0.0.0:0"
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true
