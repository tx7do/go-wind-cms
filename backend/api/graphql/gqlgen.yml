# gqlgen 配置——GraphQL 契约与产物的分层：
#   schema.graphql        契约源（手写，本目录）
#   ./gen/                 生成产物（exec + models，不手改，随代码提交）
#   resolver.go            解析器骨架/实现（app 服务 internal，引 BFF 服务取数）
#
# 注意：产物刻意放在 buf.gen.yaml 的 out（gen/go）之外——buf v2 `clean: true`
# 会删除模板所有 out 目录树，放 gen/go 里会被 `gow api`/`make api` 连带清掉
# （2026-11-08 之前曾多次踩坑）。schema 变更后跑 `make graphql` 重新生成。
schema:
  - schema.graphql

exec:
  filename: ./gen/generated.go
  package: graphql

model:
  filename: ./gen/models_gen.go
  package: graphql

resolver:
  layout: single-file
  package: graphql
  filename: ../../app/app/service/internal/graphql/resolver.go
