syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "content/service/v1/page.proto";

// 页面服务
service PageService {
  // 获取页面列表
  rpc List (pagination.PagingRequest) returns (content.service.v1.ListPageResponse) {
    option (google.api.http) = {
      get: "/admin/v1/pages"
    };
  }

  // 获取页面数据
  rpc Get (content.service.v1.GetPageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      get: "/admin/v1/pages/{id}"
    };
  }

  // 创建页面
  rpc Create (content.service.v1.CreatePageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      post: "/admin/v1/pages"
      body: "*"
    };
  }

  // 更新页面
  rpc Update (content.service.v1.UpdatePageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      put: "/admin/v1/pages/{id}"
      body: "*"
    };
  }

  // 删除页面
  rpc Delete (content.service.v1.DeletePageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/pages/{id}"
    };
  }

  // 列出页面版本（按版本号倒序）
  rpc ListVersions(content.service.v1.ListPageVersionsRequest) returns (content.service.v1.ListPageVersionsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/pages/{page_id}/versions"
    };
  }

  // 获取页面版本详情
  rpc GetVersion(content.service.v1.GetPageVersionRequest) returns (content.service.v1.PageVersion) {
    option (google.api.http) = {
      get: "/admin/v1/pages/versions/{id}"
    };
  }

  // 恢复页面到指定版本（恢复动作本身会生成一个新版本）
  rpc RestoreVersion(content.service.v1.RestorePageVersionRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      post: "/admin/v1/pages/{page_id}/versions/{version_id}/restore"
      body: "*"
    };
  }
}
