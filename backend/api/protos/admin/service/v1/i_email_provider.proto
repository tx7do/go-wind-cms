syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "notify/service/v1/email_provider.proto";

// 邮件出站 SMTP 配置管理服务（平台基础设施）
service EmailProviderService {
  // 获取配置列表
  rpc List (pagination.PagingRequest) returns (notify.service.v1.ListEmailProvidersResponse) {
    option (google.api.http) = {
      get: "/admin/v1/email-providers"
    };
  }

  // 获取配置数据
  rpc Get (notify.service.v1.GetEmailProviderRequest) returns (notify.service.v1.EmailProvider) {
    option (google.api.http) = {
      get: "/admin/v1/email-providers/{id}"
    };
  }

  // 创建配置
  rpc Create (notify.service.v1.CreateEmailProviderRequest) returns (notify.service.v1.EmailProvider) {
    option (google.api.http) = {
      post: "/admin/v1/email-providers"
      body: "*"
    };
  }

  // 更新配置
  rpc Update (notify.service.v1.UpdateEmailProviderRequest) returns (notify.service.v1.EmailProvider) {
    option (google.api.http) = {
      put: "/admin/v1/email-providers/{id}"
      body: "*"
    };
  }

  // 删除配置
  rpc Delete (notify.service.v1.DeleteEmailProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/email-providers/{id}"
    };
  }

  // 发送测试邮件
  rpc TestSend (notify.service.v1.TestEmailSendRequest) returns (notify.service.v1.TestEmailSendResponse) {
    option (google.api.http) = {
      post: "/admin/v1/email-providers/{id}/test-send"
      body: "*"
    };
  }
}
