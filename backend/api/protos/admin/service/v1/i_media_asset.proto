syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "media/service/v1/media_asset.proto";

// 媒体资源库服务
service MediaAssetService {
  // 获取媒体资源库列表
  rpc List (pagination.PagingRequest) returns (media.service.v1.ListMediaAssetResponse) {
      option (google.api.http) = {
        get: "/admin/v1/media-assets"
      };
  }

  // 获取媒体资源库数据
  rpc Get (media.service.v1.GetMediaAssetRequest) returns (media.service.v1.MediaAsset) {
      option (google.api.http) = {
        get: "/admin/v1/media-assets/{id}"
      };
  }

  // 创建媒体资源库
  rpc Create (media.service.v1.CreateMediaAssetRequest) returns (media.service.v1.MediaAsset) {
      option (google.api.http) = {
        post: "/admin/v1/media-assets"
        body: "*"
      };
  }

  // 更新媒体资源库
  rpc Update (media.service.v1.UpdateMediaAssetRequest) returns (media.service.v1.MediaAsset) {
      option (google.api.http) = {
        put: "/admin/v1/media-assets/{id}"
        body: "*"
      };
  }

  // 按内容哈希查重。注意不能挂在 /media-assets/{file_hash} 形态下——
  // 与 Get({id}) 单段路由冲突（先注册者胜，{id} 会把字面量当 ID 解析报 CODEC）。
  rpc FindByHash (media.service.v1.FindMediaAssetByHashRequest) returns (media.service.v1.FindMediaAssetByHashResponse) {
    option (google.api.http) = {
      get: "/admin/v1/media-asset-by-hash/{file_hash}"
    };
  }

  // 重复资源分组（同租户内同内容哈希 >1 条）。路径避开 /media-assets/{id} 单段遮蔽。
  rpc ListDuplicatedMediaAssets (media.service.v1.ListDuplicatedMediaAssetsRequest) returns (media.service.v1.ListDuplicatedMediaAssetsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/media-duplicates"
    };
  }

  // 媒体被内容引用的关系（引用图谱查询）
  rpc ListMediaAssetReferences (media.service.v1.ListMediaAssetReferencesRequest) returns (media.service.v1.ListMediaAssetReferencesResponse) {
    option (google.api.http) = {
      get: "/admin/v1/media-assets/{media_asset_id}/references"
    };
  }

  rpc Delete (media.service.v1.DeleteMediaAssetRequest) returns (google.protobuf.Empty) {
      option (google.api.http) = {
        delete: "/admin/v1/media-assets/{id}"
      };
  }
}
