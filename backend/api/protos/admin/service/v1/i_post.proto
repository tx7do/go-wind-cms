syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "content/service/v1/post.proto";

// 帖子服务
service PostService {
  // 获取帖子列表
  rpc List (pagination.PagingRequest) returns (content.service.v1.ListPostResponse) {
    option (google.api.http) = {
      get: "/admin/v1/posts"
    };
  }

  // 获取帖子数据
  rpc Get (content.service.v1.GetPostRequest) returns (content.service.v1.Post) {
    option (google.api.http) = {
      get: "/admin/v1/posts/{id}"
    };
  }

  // 创建帖子
  rpc Create (content.service.v1.CreatePostRequest) returns (content.service.v1.Post) {
    option (google.api.http) = {
      post: "/admin/v1/posts"
      body: "*"
    };
  }

  // 更新帖子
  rpc Update (content.service.v1.UpdatePostRequest) returns (content.service.v1.Post) {
    option (google.api.http) = {
      put: "/admin/v1/posts/{id}"
      body: "*"
    };
  }

  // 删除帖子
  rpc Delete (content.service.v1.DeletePostRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/posts/{id}"
    };
  }

  // 检查翻译是否存在
  rpc TranslationExists(content.service.v1.PostTranslationExistsRequest) returns (content.service.v1.PostTranslationExistsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/posts/{post_id}/translations/{language_code}"
    };
  }

  // 列出帖子版本（按版本号倒序）
  rpc ListVersions(content.service.v1.ListPostVersionsRequest) returns (content.service.v1.ListPostVersionsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/posts/{post_id}/versions"
    };
  }

  // 获取帖子版本详情
  rpc GetVersion(content.service.v1.GetPostVersionRequest) returns (content.service.v1.PostVersion) {
    option (google.api.http) = {
      get: "/admin/v1/posts/versions/{id}"
    };
  }

  // 恢复帖子到指定版本（恢复动作本身会生成一个新版本）
  rpc RestoreVersion(content.service.v1.RestorePostVersionRequest) returns (content.service.v1.Post) {
    option (google.api.http) = {
      post: "/admin/v1/posts/{post_id}/versions/{version_id}/restore"
      body: "*"
    };
  }
}
