syntax = "proto3";

package webhook.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// Webhook 服务：内容事件外发订阅管理。
// 事件类型：post.created / post.updated / post.published / post.deleted /
// page.created / page.updated / page.published / page.deleted；
// events 为空表示订阅全部。投递为 HMAC-SHA256 签名（X-Webhook-Signature）。
service WebhookService {
  // 获取 Webhook 列表
  rpc List (pagination.PagingRequest) returns (ListWebhookResponse) {}

  // 获取 Webhook 数据
  rpc Get (GetWebhookRequest) returns (Webhook) {}

  // 创建 Webhook
  rpc Create (CreateWebhookRequest) returns (Webhook) {}

  // 更新 Webhook
  rpc Update (UpdateWebhookRequest) returns (Webhook) {}

  // 删除 Webhook
  rpc Delete (DeleteWebhookRequest) returns (google.protobuf.Empty) {}

  // 发送测试事件（ping）
  rpc TestPing (TestWebhookPingRequest) returns (WebhookDelivery) {}

  // 列出投递记录（按时间倒序）
  rpc ListDeliveries (ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {}
}

// Webhook 订阅
message Webhook {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "Webhook ID"}
  ]; // Webhook ID

  optional string url = 2 [
    json_name = "url",
    (gnostic.openapi.v3.property) = {description: "回调 URL"}
  ]; // 回调 URL

  optional string secret = 3 [
    json_name = "secret",
    (gnostic.openapi.v3.property) = {description: "签名密钥（X-Webhook-Signature: sha256=HMAC(body)）"}
  ]; // 签名密钥

  repeated string events = 4 [
    json_name = "events",
    (gnostic.openapi.v3.property) = {description: "订阅的事件类型；空=全部"}
  ]; // 订阅的事件类型

  optional bool enabled = 5 [
    json_name = "enabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ]; // 是否启用

  optional string description = 6 [
    json_name = "description",
    (gnostic.openapi.v3.property) = {description: "用途说明"}
  ]; // 用途说明

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
}

// 回应 - Webhook 列表
message ListWebhookResponse {
  repeated Webhook items = 1;
  uint64 total = 2;
}

// 请求 - Webhook 数据
message GetWebhookRequest {
  uint32 id = 1;
}

// 请求 - 创建 Webhook
message CreateWebhookRequest {
  Webhook data = 1;
}

// 请求 - 更新 Webhook
message UpdateWebhookRequest {
  uint32 id = 1;

  Webhook data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "不存在则新增"},
    json_name = "allowMissing"
  ]; // 不存在则新增
}

// 请求 - 删除 Webhook
message DeleteWebhookRequest {
  uint32 id = 1;
}

// 请求 - 发送测试事件
message TestWebhookPingRequest {
  uint32 id = 1 [
    (gnostic.openapi.v3.property) = {description: "Webhook ID"}
  ];
}

// 投递记录（每次尝试一行）
message WebhookDelivery {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "投递记录ID"}
  ]; // 投递记录ID

  optional uint32 webhook_id = 2 [
    json_name = "webhookId",
    (gnostic.openapi.v3.property) = {description: "关联的 Webhook ID"}
  ]; // 关联的 Webhook ID

  optional string event = 3 [
    json_name = "event",
    (gnostic.openapi.v3.property) = {description: "事件类型"}
  ]; // 事件类型

  optional uint32 entity_id = 4 [
    json_name = "entityId",
    (gnostic.openapi.v3.property) = {description: "事件主体 ID"}
  ]; // 事件主体 ID

  optional string status = 5 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "投递状态（DELIVERY_STATUS_SUCCESS/FAILED）"}
  ]; // 投递状态

  optional int32 http_status = 6 [
    json_name = "httpStatus",
    (gnostic.openapi.v3.property) = {description: "响应 HTTP 状态码（0=未达 HTTP 层）"}
  ]; // 响应 HTTP 状态码

  optional string error = 7 [
    json_name = "error",
    (gnostic.openapi.v3.property) = {description: "失败原因"}
  ]; // 失败原因

  optional uint32 duration_ms = 8 [
    json_name = "durationMs",
    (gnostic.openapi.v3.property) = {description: "耗时（毫秒）"}
  ]; // 耗时（毫秒）

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 请求 - 列出投递记录
message ListWebhookDeliveriesRequest {
  uint32 webhook_id = 1 [
    json_name = "webhookId",
    (gnostic.openapi.v3.property) = {description: "Webhook ID；0=全部"}
  ];

  uint32 limit = 2 [
    (gnostic.openapi.v3.property) = {description: "条数上限（默认 50，封顶 200）"}
  ];
}

// 回应 - 投递记录列表
message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery items = 1 [json_name = "items"];
  uint64 total = 2;
}
