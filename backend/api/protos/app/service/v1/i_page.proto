syntax = "proto3";

package app.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "content/service/v1/page.proto";

// 页面服务
service PageService {
  // 获取页面列表
  rpc List (pagination.PagingRequest) returns (content.service.v1.ListPageResponse) {
    option (google.api.http) = {
      get: "/app/v1/pages"
    };
  }

  // 获取页面数据
  rpc Get (content.service.v1.GetPageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      get: "/app/v1/pages/{id}"
    };
  }

  // 创建页面
  rpc Create (content.service.v1.CreatePageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      post: "/app/v1/pages"
      body: "*"
    };
  }

  // 更新页面
  rpc Update (content.service.v1.UpdatePageRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      put: "/app/v1/pages/{id}"
      body: "*"
    };
  }

  // 删除页面
  rpc Delete (content.service.v1.DeletePageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/app/v1/pages/{id}"
    };
  }

  // 获取翻译数据
  rpc GetTranslation(content.service.v1.GetPageRequest) returns (content.service.v1.PageTranslation) {
    option (google.api.http) = {
      get: "/app/v1/pages/{id}/translation"
    };
  }

  // 按 slug 获取页面（公开，SEO 路由 /page/{slug} 的数据源）
  rpc GetBySlug (GetPageBySlugRequest) returns (content.service.v1.Page) {
    option (google.api.http) = {
      get: "/app/v1/pages/by-slug/{slug}"
    };
  }
}

// 请求 - 按 slug 获取页面
message GetPageBySlugRequest {
  string slug = 1 [
    (gnostic.openapi.v3.property) = {description: "页面 slug（主表或任一语言翻译的 slug）"}
  ];

  string locale = 2 [
    (gnostic.openapi.v3.property) = {description: "语言代码，指定返回哪个语言版本的翻译"}
  ];
}
