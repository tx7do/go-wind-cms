syntax = "proto3";

package content.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/timestamp.proto";

import "content/service/v1/types.proto";

// 页面区块（语言无关的结构，内容随语言变化在翻译表中）。
// 作为 Page 的嵌套子部件随页面整体读写，无独立服务入口。
message Section {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "区块ID"}
  ]; // 区块ID

  optional uint32 page_id = 2 [
    json_name = "pageId",
    (gnostic.openapi.v3.property) = {description: "所属页面ID"}
  ]; // 所属页面ID

  optional SectionType type = 3 [
    json_name = "type",
    (gnostic.openapi.v3.property) = {description: "区块类型"}
  ]; // 区块类型

  optional string name = 4 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "区块名称（后台标识用，语言无关）"}
  ]; // 区块名称（后台标识用，语言无关）

  optional uint32 sort_order = 5 [
    json_name = "sortOrder",
    (gnostic.openapi.v3.property) = {description: "排序（越小越靠前）"}
  ]; // 排序（越小越靠前）

  map<string, string> config = 10 [
    json_name = "config",
    (gnostic.openapi.v3.property) = {description: "区块样式/布局配置（边距、CSS class、列数等，语言无关）"}
  ]; // 区块样式/布局配置（语言无关）


  repeated SectionTranslation translations = 20 [
    json_name = "translations",
    (gnostic.openapi.v3.property) = {description: "多语言翻译列表"}
  ]; // 多语言翻译列表

  repeated string available_languages = 21 [
    json_name = "availableLanguages",
    (gnostic.openapi.v3.property) = {
      description: "可用的语言代码列表（快速查询，避免遍历 translations）",
      example: {yaml: '["zh-CN", "en-US", "ja-JP"]'}
    }
  ]; // 可用的语言代码列表


  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 区块翻译（语言相关的内容）
message SectionTranslation {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "翻译记录ID"}
  ]; // 翻译记录ID

  optional uint32 section_id = 2 [
    json_name = "sectionId",
    (gnostic.openapi.v3.property) = {description: "关联的区块ID"}
  ]; // 关联的区块ID

  optional string language_code = 3 [
    json_name = "languageCode",
    (gnostic.openapi.v3.property) = {
      description: "语言代码（ISO 639-1 标准）"
    }
  ]; // 语言代码


  map<string, string> content = 10 [
    json_name = "content",
    (gnostic.openapi.v3.property) = {description: "区块内容（键值对，适配不同类型区块，随语言变化）"}
  ]; // 区块内容（键值对，适配不同类型区块，随语言变化）


  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}
