syntax = "proto3";

package content.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// URL 重定向服务（SEO 迁移/短链管理）。
// 消费方：C 端路由中间件按 from_path 匹配 3xx 跳转；nginx/CDN 可经 admin
// 导出 map 配置做边缘层直跳（后端不参与运行时 3xx，避免为静态站引后端依赖）。
service RedirectService {
  // 获取重定向列表
  rpc List (pagination.PagingRequest) returns (ListRedirectsResponse) {}

  // 获取重定向数据
  rpc Get (GetRedirectRequest) returns (Redirect) {}

  // 创建重定向
  rpc Create (CreateRedirectRequest) returns (Redirect) {}

  // 更新重定向
  rpc Update (UpdateRedirectRequest) returns (Redirect) {}

  // 删除重定向
  rpc Delete (DeleteRedirectRequest) returns (google.protobuf.Empty) {}
}

// URL 重定向
message Redirect {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "重定向ID"}
  ]; // 重定向ID

  optional string from_path = 2 [
    json_name = "fromPath",
    (gnostic.openapi.v3.property) = {description: "源路径（站内相对路径，如 /old-post）"}
  ]; // 源路径

  optional string to_url = 3 [
    json_name = "toUrl",
    (gnostic.openapi.v3.property) = {description: "目标地址（站内路径或完整 URL）"}
  ]; // 目标地址

  optional uint32 status_code = 4 [
    json_name = "statusCode",
    (gnostic.openapi.v3.property) = {description: "HTTP 状态码（301/302/307/308）"}
  ]; // HTTP 状态码

  optional bool enabled = 5 [
    json_name = "enabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ]; // 是否启用

  optional string description = 6 [
    json_name = "description",
    (gnostic.openapi.v3.property) = {description: "用途说明"}
  ]; // 用途说明

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
}

// 回应 - 重定向列表
message ListRedirectsResponse {
  repeated Redirect items = 1;
  uint64 total = 2;
}

// 请求 - 重定向数据
message GetRedirectRequest {
  uint32 id = 1;
}

// 请求 - 创建重定向
message CreateRedirectRequest {
  Redirect data = 1;
}

// 请求 - 更新重定向
message UpdateRedirectRequest {
  uint32 id = 1;

  Redirect data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "不存在则新增"},
    json_name = "allowMissing"
  ]; // 不存在则新增
}

// 请求 - 删除重定向
message DeleteRedirectRequest {
  uint32 id = 1;
}

// 请求 - 重定向列表（复用：List 分页 / ListEnabled 全量启用的空参请求）
message ListRedirectsRequest {
  // 空：app ListEnabled 用（仅启用项，全量）
}
