syntax = "proto3";

package social.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// 社交分发服务（core）：社交账号与内容分发记录的 CRUD 及发布/回拉动词。
// 设计约定：CMS post 是唯一内容事实源，本域只存"分发记录"（发布任务 + 平台覆盖文案 +
// 回拉的互动统计），不建独立内容模型。
service SocialService {
  // ── 社交账号 ──

  // 获取社交账号列表
  rpc ListSocialAccounts (pagination.PagingRequest) returns (ListSocialAccountsResponse) {}

  // 获取社交账号数据
  rpc GetSocialAccount (GetSocialAccountRequest) returns (SocialAccount) {}

  // 创建社交账号（凭据在服务端验证并加密落库）
  rpc CreateSocialAccount (CreateSocialAccountRequest) returns (SocialAccount) {}

  // 更新社交账号（credentials 在 update_mask 中且非空时重新验证并加密）
  rpc UpdateSocialAccount (UpdateSocialAccountRequest) returns (SocialAccount) {}

  // 删除社交账号
  rpc DeleteSocialAccount (DeleteSocialAccountRequest) returns (google.protobuf.Empty) {}

  // ── 内容分发 ──

  // 获取分发记录列表
  rpc ListSocialDistributions (pagination.PagingRequest) returns (ListSocialDistributionsResponse) {}

  // 获取分发记录数据
  rpc GetSocialDistribution (GetSocialDistributionRequest) returns (SocialDistribution) {}

  // 创建分发记录（status=SCHEDULED 且 publish_time 非空时按时刻入队，缺省立即发布）
  rpc CreateSocialDistribution (CreateSocialDistributionRequest) returns (SocialDistribution) {}

  // 更新分发记录（改期会重新入队）
  rpc UpdateSocialDistribution (UpdateSocialDistributionRequest) returns (SocialDistribution) {}

  // 删除分发记录
  rpc DeleteSocialDistribution (DeleteSocialDistributionRequest) returns (google.protobuf.Empty) {}

  // 立即发布一条分发记录（仅 DRAFT/SCHEDULED/FAILED 状态可触发）
  rpc PublishSocialDistribution (PublishSocialDistributionRequest) returns (SocialDistribution) {}

  // 回拉指定分发记录的平台互动统计（点赞/回复/转发快照）
  rpc RefreshSocialDistributionStats (RefreshSocialDistributionStatsRequest) returns (SocialDistribution) {}
}

// 社交平台
enum Platform {
  PLATFORM_UNSPECIFIED = 0;

  PLATFORM_BLUESKY = 1;   // Bluesky（AT Protocol，App Password 认证）
  PLATFORM_MASTODON = 2;  // Mastodon（access token）
  PLATFORM_DEVTO = 3;     // DEV.to（API Key）
  PLATFORM_TELEGRAM = 4;  // Telegram 频道（Bot Token + chat_id）
  PLATFORM_WORDPRESS = 5; // WordPress（应用密码 Basic Auth）
  PLATFORM_WECHAT_OA = 6; // 微信公众号（AppID/AppSecret，需认证号与 IP 白名单）
  PLATFORM_NOSTR = 7;     // Nostr（开放协议，私钥即账户）
  PLATFORM_WEIBO = 8;     // 微博（OAuth2 access token，需应用过审）
  PLATFORM_LINKEDIN = 9;  // LinkedIn 个人动态（OAuth2 access token）
}

// 社交账号
message SocialAccount {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "账号ID"}
  ]; // 账号ID

  optional Platform platform = 2 [
    json_name = "platform",
    (gnostic.openapi.v3.property) = {description: "社交平台"}
  ]; // 社交平台

  optional string name = 3 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "账号显示名称"}
  ]; // 账号显示名称

  optional string handle = 4 [
    json_name = "handle",
    (gnostic.openapi.v3.property) = {description: "平台内账号标识（如 user.bsky.social）"}
  ]; // 平台内账号标识

  optional string credentials = 5 [
    json_name = "credentials",
    (gnostic.openapi.v3.property) = {description: "平台凭据（JSON 对象字符串；仅写入；读取时恒为空，脱敏值见 credentialHint；服务端 AES-GCM 加密落库）"}
  ]; // 平台凭据（仅写入，读取恒为空）

  optional string credential_hint = 6 [
    json_name = "credentialHint",
    (gnostic.openapi.v3.property) = {description: "凭据脱敏提示（如 app-password ***wxyz）"}
  ]; // 凭据脱敏提示

  optional bool is_enabled = 7 [
    json_name = "isEnabled",
    (gnostic.openapi.v3.property) = {description: "是否启用（停用账号不参与发布）"}
  ]; // 是否启用

  optional string remark = 8 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 内容分发记录
message SocialDistribution {
  // 分发状态
  enum Status {
    STATUS_UNSPECIFIED = 0;

    STATUS_DRAFT = 1;     // 草稿（未排期）
    STATUS_SCHEDULED = 2; // 已排期（等待到点发布）
    STATUS_PUBLISHING = 3; // 发布中
    STATUS_PUBLISHED = 4; // 已发布
    STATUS_FAILED = 5;    // 发布失败（可重试）
  }

  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "分发记录ID"}
  ]; // 分发记录ID

  optional Platform platform = 2 [
    json_name = "platform",
    (gnostic.openapi.v3.property) = {description: "社交平台"}
  ]; // 社交平台

  optional uint32 account_id = 3 [
    json_name = "accountId",
    (gnostic.openapi.v3.property) = {description: "使用的社交账号ID"}
  ]; // 使用的社交账号ID

  optional string account_name = 4 [
    json_name = "accountName",
    (gnostic.openapi.v3.property) = {description: "社交账号显示名称（服务端填充的展示字段）"}
  ]; // 社交账号显示名称（展示字段）

  optional uint32 post_id = 5 [
    json_name = "postId",
    (gnostic.openapi.v3.property) = {description: "关联的 CMS 文章ID（内容事实源在 CMS，本域不存内容本体）"}
  ]; // 关联的 CMS 文章ID

  optional string post_title = 6 [
    json_name = "postTitle",
    (gnostic.openapi.v3.property) = {description: "关联文章标题（服务端填充的展示字段）"}
  ]; // 关联文章标题（展示字段）

  optional string override_text = 7 [
    json_name = "overrideText",
    (gnostic.openapi.v3.property) = {description: "按平台覆盖的发布文案（空则应从源内容推导）"}
  ]; // 按平台覆盖的发布文案

  optional Status status = 8 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "分发状态"}
  ]; // 分发状态

  optional google.protobuf.Timestamp publish_time = 9 [
    json_name = "publishTime",
    (gnostic.openapi.v3.property) = {description: "计划发布时间（空表示立即发布）"}
  ]; // 计划发布时间

  optional google.protobuf.Timestamp published_at = 10 [
    json_name = "publishedAt",
    (gnostic.openapi.v3.property) = {description: "实际发布时间"}
  ]; // 实际发布时间

  optional string external_uri = 11 [
    json_name = "externalUri",
    (gnostic.openapi.v3.property) = {description: "平台侧帖子 URI（如 at://... 或 https://...）"}
  ]; // 平台侧帖子 URI

  optional string external_id = 12 [
    json_name = "externalId",
    (gnostic.openapi.v3.property) = {description: "平台侧帖子 ID（用于统计回拉定位）"}
  ]; // 平台侧帖子 ID

  optional string error_message = 13 [
    json_name = "errorMessage",
    (gnostic.openapi.v3.property) = {description: "最近一次发布失败的原因"}
  ]; // 最近一次发布失败的原因

  optional string title = 14 [
    json_name = "title",
    (gnostic.openapi.v3.property) = {description: "平台文章标题（DEV.to 等需要标题的平台使用；关联文章且留空时缺省取文章标题）"}
  ]; // 平台文章标题

  optional uint32 likes = 20 [
    json_name = "likes",
    (gnostic.openapi.v3.property) = {description: "点赞数（平台回拉快照）"}
  ]; // 点赞数（回拉快照）

  optional uint32 replies = 21 [
    json_name = "replies",
    (gnostic.openapi.v3.property) = {description: "回复数（平台回拉快照）"}
  ]; // 回复数（回拉快照）

  optional uint32 reposts = 22 [
    json_name = "reposts",
    (gnostic.openapi.v3.property) = {description: "转发数（平台回拉快照）"}
  ]; // 转发数（回拉快照）

  optional google.protobuf.Timestamp stats_synced_at = 23 [
    json_name = "statsSyncedAt",
    (gnostic.openapi.v3.property) = {description: "统计回拉时间"}
  ]; // 统计回拉时间

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 回应 - 社交账号列表
message ListSocialAccountsResponse {
  repeated SocialAccount items = 1;
  uint64 total = 2;
}

// 请求 - 社交账号数据
message GetSocialAccountRequest {
  uint32 id = 1;

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器
}

// 请求 - 创建社交账号
message CreateSocialAccountRequest {
  SocialAccount data = 1;
}

// 请求 - 更新社交账号
message UpdateSocialAccountRequest {
  uint32 id = 1;

  SocialAccount data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml: "id,name,isEnabled"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 资源不存在则新增
}

// 请求 - 删除社交账号
message DeleteSocialAccountRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 回应 - 分发记录列表
message ListSocialDistributionsResponse {
  repeated SocialDistribution items = 1;
  uint64 total = 2;
}

// 请求 - 分发记录数据
message GetSocialDistributionRequest {
  uint32 id = 1;

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器
}

// 请求 - 创建分发记录
message CreateSocialDistributionRequest {
  SocialDistribution data = 1;
}

// 请求 - 更新分发记录
message UpdateSocialDistributionRequest {
  uint32 id = 1;

  SocialDistribution data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml: "id,overrideText,publishTime"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 资源不存在则新增
}

// 请求 - 删除分发记录
message DeleteSocialDistributionRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 请求 - 立即发布分发记录
message PublishSocialDistributionRequest {
  uint32 id = 1;
}

// 请求 - 回拉分发记录统计
message RefreshSocialDistributionStatsRequest {
  uint32 id = 1;
}
