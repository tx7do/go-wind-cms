syntax = "proto3";

package interaction.service.v1;

import "pagination/v1/pagination.proto";
import "content/service/v1/post.proto";

// 交互服务（点赞/收藏计数内聚子系统）
//
// 作为点赞/收藏计数的唯一写入方，集中管理 ledger 记录及 interaction_counter 表的
// 计数 upsert。post/comment 表上的散落计数列已移除，计数统一存于 counter 表。
// viewer 用户身份由鉴权上下文注入，请求体不接受 user_id。
//
// 注意：ListWatchedPosts 复用 content.service.v1.ListPostResponse，因此本 proto
// import content/service/v1/post.proto。这是仓库内首个跨模块 L1 import，权衡是
// 让网关转发器保持纯透传（参照其余转发器），并避免收藏列表的 N 次 PostService.Get 聚合调用。
service InteractionService {
  // 点赞（post 或 comment）。幂等：已点赞则 no-op。
  rpc Like (LikeRequest) returns (LikeResponse) {}

  // 取消点赞。幂等：未点赞则 no-op。
  rpc Unlike (LikeRequest) returns (LikeResponse) {}

  // 收藏 post。
  rpc Watch (WatchRequest) returns (WatchResponse) {}

  // 取消收藏 post。
  rpc Unwatch (WatchRequest) returns (WatchResponse) {}

  // 批量查询当前 viewer 对指定目标的交互状态（供前端渲染按钮态，不含计数）。
  rpc GetInteractionStatus (GetInteractionStatusRequest) returns (GetInteractionStatusResponse) {}

  // 列出当前 viewer 收藏的 post。
  rpc ListWatchedPosts (pagination.PagingRequest) returns (content.service.v1.ListPostResponse) {}

  // 批量查询指定目标的计数（如点赞数）。供前端列表/详情渲染计数展示。
  rpc GetCounts (GetCountsRequest) returns (GetCountsResponse) {}
}

// 交互目标类型
enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;
  TARGET_TYPE_POST = 1;
  TARGET_TYPE_COMMENT = 2;
}

// 计数指标类型。与 interaction_counter 表的 metric 列对应。
// 当前仅点赞计数活跃；后续若新增浏览量/点踩等，在此扩展枚举值即可，无需改 schema。
enum CounterMetric {
  COUNTER_METRIC_UNSPECIFIED = 0;
  COUNTER_METRIC_LIKE = 1;
  COUNTER_METRIC_WATCH = 2;
}

message LikeRequest {
  TargetType target_type = 1;
  uint32 target_id = 2;
}

message LikeResponse {
  bool liked = 1;       // 操作后的当前点赞状态
  int32 like_count = 2; // 操作后的最新点赞计数
}

message WatchRequest {
  uint32 post_id = 1;
}

message WatchResponse {
  bool watched = 1;     // 操作后的当前收藏状态
  int32 watch_count = 2; // 操作后的最新收藏计数
}

message GetInteractionStatusRequest {
  TargetType target_type = 1;
  repeated uint32 target_ids = 2;
}

message InteractionStatus {
  bool liked = 1;
  bool watched = 2; // 仅对 post 目标有意义；comment 目标永远为 false
}

message GetInteractionStatusResponse {
  map<uint32, InteractionStatus> statuses = 1;
}

// 单个 (target, metric) 的计数条目。用于 GetCountsResponse 的内层结构。
// 注意：proto3 不允许枚举类型作 map key，故内层用 repeated MetricCount 而非 map<CounterMetric,int64>。
message MetricCount {
  CounterMetric metric = 1;
  int64 count = 2;
}

// 单个目标下所有请求 metric 的计数集合。
message CountMap {
  repeated MetricCount counts = 1;
}

message GetCountsRequest {
  TargetType target_type = 1;
  repeated uint32 target_ids = 2;
  repeated CounterMetric metrics = 3;
}

// target_id → 该目标下各 metric 的计数集合。
// 未在 counter 表中记录的 (target, metric) 组合不出现在响应中，前端按 0 兜底。
message GetCountsResponse {
  map<uint32, CountMap> counts = 1;
}
