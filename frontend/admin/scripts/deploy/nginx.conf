
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  # ------------------------------------------------------------------
  # 后端转发 upstream：前端全部走同源相对路径（.env.production 已同源化），
  # 由本层 nginx 按 location 前缀转发，不再经独立 API 域名（无 CORS）。
  # 容器内访问宿主机后端用 host.docker.internal（Docker Desktop 可用，
  # Linux 需 compose 加 extra_hosts: "host.docker.internal:host-gateway"
  # 或直接改成宿主机 LAN IP）；宿主机直接跑 nginx 则写 127.0.0.1。
  # ------------------------------------------------------------------
  upstream admin_rest {
    server host.docker.internal:6600;  # admin REST（/admin/v1/...，上传限 100MiB）
  }
  upstream admin_sse {
    server host.docker.internal:6601;  # admin SSE 独立端口（/events）
  }
  upstream admin_collab {
    server host.docker.internal:6602;  # 协同 yjs ws 独立端口（/collab）
  }

  server {
    listen 8080;
    server_name localhost;

    # 上传走同源转发，放开请求体上限（后端 MaxUploadObjectSize=100MiB，留余量）
    client_max_body_size 110m;

    # admin REST API：后端路由自带 /admin/v1 前缀，原样转发不做 rewrite
    location /admin/ {
      proxy_pass http://admin_rest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # SSE（站内信/AI 对话/Agent 运行轨迹）：关缓冲 + 长读超时，保活连接不缓冲
    location = /events {
      proxy_pass http://admin_sse;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 24h;
    }

    # 协同 yjs ws：Upgrade/Connection 升级头必须；路径原样（ygo 不校验 path）
    location /collab {
      proxy_pass http://admin_collab;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # CORS 收敛（对齐上游 P3）：静态资源同源部署无跨域需求，不发 ACAO 通配；
      # API 域的跨域由后端 CORS 白名单负责，前端层不再放开 *
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      # 安全响应头：点击劫持 / MIME 嗅探 / Referer 泄露 / 强制 HTTPS。
      # nginx 的 add_header 在 location 内会覆盖上层，故须与 CORS 同处声明；
      # always 使头覆盖错误响应（404 等），否则仅 2xx/3xx 生效。
      add_header X-Frame-Options 'DENY' always;
      add_header X-Content-Type-Options 'nosniff' always;
      add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
      add_header Strict-Transport-Security 'max-age=63072000; includeSubDomains' always;
      # script-src 不在此声明：多 CSP 策略浏览器取交集，meta 内的 script-src
      # 带构建期计算的内联脚本 sha256 白名单（build/plugins/csp.ts），若在此重复
      # 声明无哈希的 script-src 会把白名单重新收窄、内联主题脚本再度被拦。
      add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
