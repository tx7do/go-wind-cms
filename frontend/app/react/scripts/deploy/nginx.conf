# GoWind Content Hub C 端站点 nginx 部署模板
#
# 架构：前端不再直连独立 API 域名，浏览器一律请求本站同源路径，
# 由本层 nginx 按前缀转发到 app 服务；页面本体按各端形态托管。
#   /app/v1/...   → app REST        (:6700)
#   /events       → app SSE         (:6701，站内通知等流式推送)
#   /（其余全部）  → 页面托管：四端全为纯静态（react dist / vue .output/public /
#                    taro H5 dist / flutter build/web）
#
# 四套 C 端的接入方式（一次部署取一套，各端各自子域
# react/vue/taro/flutter.cms.gowind.cloud，与后端 CORS 白名单一致）：
#   - react：静态导出（output: 'export'，dist/ 即产物）——本文件默认形态；
#            无 node 服务、无 middleware，locale 协商由根 page.tsx 客户端
#            重定向兜底，裸深链（无语言前缀）可按下文 location 块 307 补
#   - taro： H5 为纯静态产物（root 指向 dist + try_files），
#            weapp 走小程序域（TARO_APP_API_BASE_URL 指向本站 https 域名，
#            并把域名加入微信「合法域名」白名单）
#   - flutter web：纯静态产物（build/web，root + try_files）
#   - vue：  SSG 静态产物（nuxt generate → .output/public，root + try_files；
#            回退必须用 /200.html，见文末 vue 静态变体）
#
# 与前端配置的对应关系（改 nginx 端口/路径时须同步前端 env）：
#   react/.env.production  NEXT_PUBLIC_API_BASE_URL=（空 = 同源）
#   vue/.env.production    NUXT_PUBLIC_API_BASE_URL=（空 = 同源）
#                          NUXT_API_INTERNAL_URL     （SSG 预渲染期取数直连，
#                                                    默认 127.0.0.1:6700，仅构建机需要）
#   taro/.env.production   TARO_APP_API_BASE_URL=https://<本站域名>
#   flutter_app/.env       API_BASE_URL=https://<本站域名>  SSE_URL=https://<本站域名>/events

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript js mjs;
    text/css                css;
    text/html               html;
  }

  # ws 升级连接映射（如需反代 node SSR 变体；纯静态形态无 ws，留着无害）
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  sendfile on;

  # ------------------------------------------------------------------
  # upstream：node 与 nginx 同机时用 127.0.0.1；容器部署自行替换
  # （Docker Desktop 可用 host.docker.internal，Linux 需 host-gateway 映射）
  # ------------------------------------------------------------------
  upstream app_rest {
    server 127.0.0.1:6700;  # app REST（/app/v1/...，上传限 100MiB）
  }
  upstream app_sse {
    server 127.0.0.1:6701;  # app SSE 独立端口（/events）
  }

  server {
    listen 80;
    # server_name react.cms.gowind.cloud;  # C 端站点域（各端各自子域，
    #   与后端 server.yaml CORS 白名单一致）

    # 上传走同源转发，放开请求体上限（后端 MaxUploadObjectSize=100MiB，留余量）
    client_max_body_size 110m;

    # app REST API：后端路由自带 /app/v1 前缀，原样转发不做 rewrite
    location /app/v1/ {
      proxy_pass http://app_rest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # SSE（站内通知等）：关缓冲 + 长读超时
    location = /events {
      proxy_pass http://app_sse;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 24h;
    }

    # 静态导出无 middleware 做 locale 协商：裸深链（无语言前缀，如外部系统
    # 直链 /post/detail?slug=x）在此按前缀 307 到默认语言。首个静态目录是
    # /zh-CN/，裸前缀下不存在任何文件，不会误伤静态资源。仅对外部确有
    # 裸链需求的段启用（post/page/category/tag/search）。
    # location /post/    { return 307 /zh-CN$request_uri; }
    # location /page/    { return 307 /zh-CN$request_uri; }
    # location /category/ { return 307 /zh-CN$request_uri; }

    # 页面本体：纯静态产物（react dist/ / taro H5 dist/ / flutter build/web）
    location / {
      root /usr/share/nginx/html;   # 按实际解压目录调整
      index index.html;
      try_files $uri $uri/ $uri/index.html /index.html;
    }
  }

  # ------------------------------------------------------------------
  # vue SSG 静态变体：把上面的 location / 替换为（并保留 app_rest/app_sse
  # 两个 location 与 client_max_body_size）。注意回退必须用 /200.html：
  # 根 index.html 是 prerender:done 钩子写入的 /zh-CN/ 重定向页，拿它当
  # SPA 回退会把所有未预渲染深链都重定向回首页。
  #   location / {
  #     root /var/www/cms.vue;        # .output/public 解压目录
  #     index index.html;
  #     try_files $uri $uri/ $uri.html /200.html;
  #   }
  # ------------------------------------------------------------------
}
