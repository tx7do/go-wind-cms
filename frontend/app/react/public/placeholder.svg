  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="452" cy="132" r="40" fill="#c3ddf7"/>
  <g fill="none" stroke="#006be6" stroke-linecap="round">
    <path d="M96 214 C 210 168, 330 252, 448 206 C 520 178, 570 196, 604 214" stroke-opacity="0.30" stroke-width="14"/>
    <path d="M60 264 C 190 216, 320 300, 456 254 C 528 230, 580 246, 612 262" stroke-opacity="0.18" stroke-width="14"/>
